plugins { id 'com.android.application' }
android {
    namespace 'com.cta.alarm.minimal'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cta.alarm.configtest'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '9.0-uninstall-settings'
    }
    signingConfigs {
        ctaStable {
            storeFile file('../.signing/cta.keystore')
            storePassword 'ctaAlarmStable2026'
            keyAlias 'cta_alarm'
            keyPassword 'ctaAlarmStable2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.ctaStable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
