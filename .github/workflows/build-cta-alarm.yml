name: Build CTA alarm minimal
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/cta-alarm-minimal/**'
      - '.github/workflows/build-cta-alarm.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar firma estable CTA
        run: |
          mkdir -p android/cta-alarm-minimal/.signing
          echo "$(cat android/cta-alarm-minimal/.signing/cta.keystore.b64)" | base64 -d > android/cta-alarm-minimal/.signing/cta.keystore
      - name: Crear firma estable la primera vez
        run: |
          if [ ! -s android/cta-alarm-minimal/.signing/cta.keystore ]; then
            keytool -genkeypair -v -keystore android/cta-alarm-minimal/.signing/cta.keystore -storepass ctaAlarmStable2026 -alias cta_alarm -keypass ctaAlarmStable2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CTA Alarm, OU=CTA, O=CTA, L=Alicante, C=ES"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle -p android/cta-alarm-minimal assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CTA-Alarma-Metodos
          path: android/cta-alarm-minimal/app/build/outputs/apk/debug/app-debug.apk
