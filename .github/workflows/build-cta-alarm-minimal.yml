name: Build CTA alarm minimal
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android/cta-alarm-minimal/**'
      - '.github/workflows/build-cta-alarm-minimal.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android/cta-alarm-minimal assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CTA-Alarma-Minima
          path: android/cta-alarm-minimal/app/build/outputs/apk/debug/app-debug.apk
